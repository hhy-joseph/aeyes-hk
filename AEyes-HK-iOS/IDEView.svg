  <text x="825" y="170" font-family="Helvetica" font-size="10" fill="#666666" text-anchor="middle">用相機描述周圍環境 - 為視障人士設計</text>
  
  <!-- Camera view -->
  <rect x="730" y="180" width="190" height="150" fill="#333333" rx="5" ry="5" />
  
  <!-- Capture button -->
  <rect x="775" y="345" width="100" height="40" fill="#007AFF" rx="20" ry="20" />
  <text x="825" y="370" font-family="Helvetica" font-size="16" fill="white" text-anchor="middle">影相</text>
  
  <!-- Description area -->
  <rect x="730" y="400" width="190" height="80" fill="#F8F8F8" rx="5" ry="5" stroke="#DDDDDD" stroke-width="1" />
  <text x="750" y="420" font-family="Helvetica" font-size="12" fill="#000000" font-weight="bold">文字</text>
  <text x="750" y="440" font-family="Helvetica" font-size="10" fill="#333333">描述: 圖中顯示一個公園場景，有...</text>
  
