  <text x="550" y="50" font-family="Helvetica" font-size="12" fill="#999999" text-anchor="middle">ImageAnalysisService.swift</text>
  <rect x="650" y="30" width="200" height="30" fill="#2D2D2D" />
  <text x="750" y="50" font-family="Helvetica" font-size="12" fill="#999999" text-anchor="middle">AudioSynthesisService.swift</text>
  
  <!-- Editor content - Swift code -->
  <rect x="250" y="60" width="750" height="640" fill="#1E1E1E" />
  <text x="270" y="85" font-family="Menlo, monospace" font-size="12" fill="#9CDCFE">import</text>
  <text x="320" y="85" font-family="Menlo, monospace" font-size="12" fill="white">UIKit</text>
  <text x="270" y="105" font-family="Menlo, monospace" font-size="12" fill="#9CDCFE">import</text>
  <text x="320" y="105" font-family="Menlo, monospace" font-size="12" fill="white">AVFoundation</text>
  
  <text x="270" y="135" font-family="Menlo, monospace" font-size="12" fill="#569CD6">class</text>
  <text x="305" y="135" font-family="Menlo, monospace" font-size="12" fill="#4EC9B0">MainViewController</text>
  <text x="425" y="135" font-family="Menlo, monospace" font-size="12" fill="white">: UIViewController {</text>
  
  <text x="270" y="165" font-family="Menlo, monospace" font-size="12" fill="#569CD6">    private</text>
  <text x="320" y="165" font-family="Menlo, monospace" font-size="12" fill="#569CD6">lazy</text>
  <text x="350" y="165" font-family="Menlo, monospace" font-size="12" fill="#569CD6">var</text>
  <text x="375" y="165" font-family="Menlo, monospace" font-size="12" fill="#9CDCFE">cameraView</text>
  <text x="440" y="165" font-family="Menlo, monospace" font-size="12" fill="white">: UIView = {</text>
  <text x="290" y="185" font-family="Menlo, monospace" font-size="12" fill="#569CD6">let</text>
  <text x="315" y="185" font-family="Menlo, monospace" font-size="12" fill="white">view = UIView()</text>
  <text x="290" y="205" font-family="Menlo, monospace" font-size="12" fill="white">view.backgroundColor = .black</text>
  <text x="290" y="225" font-family="Menlo, monospace" font-size="12" fill="white">view.translatesAutoresizingMaskIntoConstraints = false</text>
  <text x="290" y="245" font-family="Menlo, monospace" font-size="12" fill="#C586C0">return</text>
  <text x="330" y="245" font-family="Menlo, monospace" font-size="12" fill="white">view</text>
  <text x="270" y="265" font-family="Menlo, monospace" font-size="12" fill="white">    }()</text>
  
  <!-- More code snippets -->
  <text x="270" y="295" font-family="Menlo, monospace" font-size="12" fill="#569CD6">    private</text>
  <text x="320" y="295" font-family="Menlo, monospace" font-size="12" fill="#569CD6">lazy</text>
  <text x="350" y="295" font-family="Menlo, monospace" font-size="12" fill="#569CD6">var</text>
  <text x="375" y="295" font-family="Menlo, monospace" font-size="12" fill="#9CDCFE">captureButton</text>
  <text x="460" y="295" font-family="Menlo, monospace" font-size="12" fill="white">: UIButton = {</text>
  <text x="290" y="315" font-family="Menlo, monospace" font-size="12" fill="#569CD6">let</text>
  <text x="315" y="315" font-family="Menlo, monospace" font-size="12" fill="white">button = UIButton(type: .system)</text>
  <text x="290" y="335" font-family="Menlo, monospace" font-size="12" fill="white">button.setTitle("影相", for: .normal)</text>
  <text x="290" y="355" font-family="Menlo, monospace" font-size="12" fill="white">button.backgroundColor = UIColor(red: 0, green: 122/255, blue: 255/255, alpha: 1)</text>
  <text x="290" y="375" font-family="Menlo, monospace" font-size="12" fill="#C586C0">return</text>
  <text x="330" y="375" font-family="Menlo, monospace" font-size="12" fill="white">button</text>
  <text x="270" y="395" font-family="Menlo, monospace" font-size="12" fill="white">    }()</text>
  
  <!-- More code continuation -->
  <text x="270" y="425" font-family="Menlo, monospace" font-size="12" fill="#6A9955">    // MARK: - Lifecycle Methods</text>
  <text x="270" y="445" font-family="Menlo, monospace" font-size="12" fill="#569CD6">    override</text>
  <text x="325" y="445" font-family="Menlo, monospace" font-size="12" fill="#569CD6">func</text>
  <text x="350" y="445" font-family="Menlo, monospace" font-size="12" fill="#DCDCAA">viewDidLoad</text>
  <text x="425" y="445" font-family="Menlo, monospace" font-size="12" fill="white">() {</text>
  <text x="290" y="465" font-family="Menlo, monospace" font-size="12" fill="#569CD6">super</text>
  <text x="325" y="465" font-family="Menlo, monospace" font-size="12" fill="white">.viewDidLoad()</text>
  <text x="290" y="485" font-family="Menlo, monospace" font-size="12" fill="white">setupView()</text>
  <text x="290" y="505" font-family="Menlo, monospace" font-size="12" fill="white">setupCamera()</text>
  <text x="270" y="525" font-family="Menlo, monospace" font-size="12" fill="white">    }</text>
  
  <!-- Function definition -->
  <text x="270" y="555" font-family="Menlo, monospace" font-size="12" fill="#6A9955">    // MARK: - Action Methods</text>
  <text x="270" y="575" font-family="Menlo, monospace" font-size="12" fill="#569CD6">    @objc private func</text>
  <text x="390" y="575" font-family="Menlo, monospace" font-size="12" fill="#DCDCAA">captureButtonTapped</text>
  <text x="505" y="575" font-family="Menlo, monospace" font-size="12" fill="white">() {</text>
  <text x="290" y="595" font-family="Menlo, monospace" font-size="12" fill="white">capturePhoto()</text>
  <text x="270" y="615" font-family="Menlo, monospace" font-size="12" fill="white">    }</text>
  
  <!-- More code would continue... -->
  
  <!-- Device simulator preview -->
  <rect x="700" y="100" width="250" height="500" rx="20" ry="20" fill="#111111" stroke="#444444" stroke-width="2" />
  <rect x="720" y="120" width="210" height="420" fill="#FFFFFF" />
  
