  <!-- Footer -->
  <text x="825" y="530" font-family="Helvetica" font-size="10" fill="#666666" text-anchor="middle">由 xAI 同 AWS 提供技術支援</text>
  
  <!-- Home button (for older iPhones) or indicator bar (for newer models) -->
  <rect x="805" y="550" width="40" height="5" rx="2.5" ry="2.5" fill="#333333" />
</svg>